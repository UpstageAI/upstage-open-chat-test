projects:
  - name: openup
    projectGroup: team-openup
    projectNamespace: openup
    projectRootPath: ./
    build:
      buildImage:
        dockerContextPath: "./"
        dockerfilePath: "./Dockerfile"
        dockerBuildOptions: "--platform linux/amd64 --build-arg PROJECT_NAME=openup --network=host"
    deploy:
      default:
        helmChartBase: openup-deploy
        enableHttpScaledObject: false
        healthCheckPath: /
        containerPort: 8000
        ingressReadTimeoutSec: "600"
        ingressConnectTimeoutSec: "180"
        phase:
          prod:
            clusters:
              - cosmic-prod
            noticeSlackChannelIdList:
              # 추후에 테스트 후 아래 채널 다시 등록 예정
              # - C08780WHNMA # up-product-information-extract
              - C082HDQAETZ # feed-upstage-deployment-notification
            replicaCount: 1
            requestCpu: 4000m
            requestMemory: 12Gi
            limitCpu: 4000m
            limitMemory: 12Gi
            needApprove: false
            ingressHosts:
              - openup.upstage.ai
          dev:
            clusters:
              - cosmic-prod
